<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rebo 设置</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel" aria-labelledby="title">
      <header class="header">
        <h1 id="title">rebo</h1>
      </header>

      <p class="status" data-status role="status" aria-live="polite">正在连接当前页面…</p>

      <section class="settings" data-settings aria-label="阅读器设置" hidden>
        <label class="setting">
          <span class="setting-copy">
            <strong>使用新布局</strong>
          </span>
          <span class="switch">
            <input type="checkbox" data-setting="readerEnabled">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>

        <div class="setting setting--columns">
          <span class="setting-copy">
            <strong>信息流列数</strong>
          </span>
          <div class="density-control">
            <input class="density-slider" type="range" min="2" max="4" step="1" data-setting="columnCount" aria-label="选择信息流列数">
            <div class="density-labels" aria-hidden="true">
              <span data-density-label="2">稀疏</span>
              <span data-density-label="3">适中</span>
              <span data-density-label="4">紧凑</span>
            </div>
          </div>
        </div>

        <label class="setting">
          <span class="setting-copy">
            <strong>卡片快捷操作</strong>
            <small>开启后，可直接在卡片底部转发、评论和点赞</small>
          </span>
          <span class="switch">
            <input type="checkbox" data-setting="cardQuickActions">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
